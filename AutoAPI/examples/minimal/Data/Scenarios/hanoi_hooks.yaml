scenario_id: scn_hanoi_hooks_flow
env: test

meta:
  name: 汉诺塔 hooks 流程
  module: 汉诺塔
  tags: ["hooks", "回归"]
  priority: P1
  owner: qa

before_steps:
  - id: 等待服务稳定
    action:
      kind: wait
      seconds: 0

  # hook 中的 script 示例: 默认 expect_returncode=0,
  # 命令形态用 list 避免 shell 引号转义歧义, Windows/Linux 都能跑。
  - id: 打印 hook 启动标记
    action:
      kind: script
      command: ["python", "-c", "print('hook before_steps ok')"]

steps:
  - id: 启动任务
    use: case_start_task_success

  - id: 上传任务数据
    use: case_update_task_member_level_4
    override:
      request:
        raw:
          raw_type: json
          content:
            attrs:
              级数设置:
                state: "4"

  - id: 停止任务
    use: case_stop_task_success

  # v0.2 起 finally_steps 已废弃。原本"无论主流程成败都要执行的清理"用
  # always_run: true 的内联 action step 表达, 与 use 互斥。
  - id: 兜底等待
    action:
      kind: wait
      seconds: 0
    always_run: true

  # inline script 清理示例: extract 把 stdout 写回 ctx, 后续 step 可读。
  # always_run + continue_on_error: 主流程成败都执行, 清理脚本失败也不阻塞.
  - id: 兜底脚本清理
    action:
      kind: script
      command: ["python", "-c", "print('cleanup script ok')"]
      extract:
        - source: stdout
          as: cleanup_stdout
        - source: returncode
          as: cleanup_rc
    always_run: true
    continue_on_error: true

after_steps:
  - id: 等待清理完成
    action:
      kind: wait
      seconds: 0

assertions_ref:
  - assert_context_task_id_exists
