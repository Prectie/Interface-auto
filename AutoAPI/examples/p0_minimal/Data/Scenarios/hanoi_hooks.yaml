scenario_id: scn_hanoi_hooks_flow
env: test

meta:
  name: 汉诺塔 hooks 流程
  module: 汉诺塔
  tags: ["hooks", "回归"]
  priority: P1
  owner: qa

before_steps:
  - id: 等待服务稳定
    action:
      kind: wait
      seconds: 0

steps:
  - id: 启动任务
    use: case_start_task_success

  - id: 上传任务数据
    use: case_update_task_member_level_4
    override:
      request:
        raw:
          raw_type: json
          content:
            attrs:
              级数设置:
                state: "4"

  - id: 停止任务
    use: case_stop_task_success

after_steps:
  - id: 等待清理完成
    action:
      kind: wait
      seconds: 0

assertions_ref:
  - assert_context_task_id_exists

finally_steps:
  - id: 兜底等待
    action:
      kind: wait
      seconds: 0
