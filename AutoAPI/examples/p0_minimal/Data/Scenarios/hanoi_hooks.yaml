scenario_id: scn_hanoi_hooks_flow
env: test

meta:
  name: 汉诺塔 hooks 流程
  module: 汉诺塔
  tags: ["hooks", "回归"]
  priority: P1
  owner: qa

before_steps:
  - id: 场景前置启动任务
    use: case_start_task_success

steps:
  - id: 上传任务数据
    use: case_update_task_member_level_4
    override:
      request:
        raw:
          raw_type: json
          content:
            attrs:
              级数设置:
                state: "4"

after_steps:
  - id: 场景后置停止任务
    use: case_stop_task_success

assertions_ref:
  - assert_context_task_id_exists

finally_steps:
  - id: 场景兜底停止任务
    use: case_stop_task_success
