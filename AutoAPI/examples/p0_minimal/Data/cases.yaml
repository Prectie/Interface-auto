cases:
  case_start_task_success:
    api: api_start_task

    meta:
      name: 启动任务成功
      tags: ["冒烟", "主流程"]
      priority: P0

    request:
      body_mode: raw
      raw:
        raw_type: json
        content:
          scenarioMakeId: "${scenario_make_id}"

    assertions_ref:
      - assert_success

  case_update_task_member_level_4:
    api: api_update_task_member

    meta:
      name: 上传 4 级配置
      tags: ["回归", "主流程"]
      priority: P0

    request:
      query:
        taskId: "${taskId}"
      body_mode: raw
      raw:
        raw_type: json
        content:
          attrs:
            级数设置:
              state: "${level_state}"

  case_stop_task_success:
    api: api_stop_task

    meta:
      name: 停止任务成功
      tags: ["清理", "主流程"]
      priority: P0

    request:
      path_params:
        taskId: "${taskId}"
      body_mode: raw
      raw:
        raw_type: json
        content:
          force: true

  case_login_admin:
    api: api_login_form

    meta:
      name: 管理员表单登录
      tags: ["认证", "表单"]
      priority: P0

    request:
      body_mode: form_urlencoded
      form_urlencoded:
        username: admin
        password: admin123

  case_submit_multipart_level_4:
    api: api_submit_multipart_form

    meta:
      name: 提交 multipart 文本字段
      tags: ["multipart", "字段"]
      priority: P0

    request:
      body_mode: form_data
      form_data:
        - kind: field
          name: bizType
          value: task
        - kind: field
          name: level
          value: "4"

  case_upload_dataset_demo:
    api: api_upload_dataset

    meta:
      name: 上传示例数据文件
      tags: ["multipart", "文件"]
      priority: P0

    request:
      body_mode: form_data
      form_data:
        - kind: file
          name: file
          path: examples/p0_minimal/files/upload_demo.txt

  case_import_members_append:
    api: api_import_members

    meta:
      name: 导入成员-追加模式
      tags: ["multipart", "混合"]
      priority: P0

    request:
      body_mode: form_data
      form_data:
        - kind: field
          name: importMode
          value: append
        - kind: file
          name: file
          path: examples/p0_minimal/files/upload_demo.txt

  case_probe_with_cookie:
    api: api_request_probe

    meta:
      name: 使用显式 cookies 的请求探针
      tags: ["cookies", "probe"]
      priority: P0

    request:
      cookies:
        session_id: "${session_id}"

  case_probe_with_auth_none:
    api: api_request_probe

    meta:
      name: 使用 none auth 的请求探针
      tags: ["auth", "none"]
      priority: P0

    request:
      auth:
        type: none

  case_probe_with_bearer_auth:
    api: api_request_probe

    meta:
      name: 使用 bearer auth 的请求探针
      tags: ["auth", "bearer"]
      priority: P0

    request:
      auth:
        type: bearer
        token: "${auth_token}"

  case_probe_with_basic_auth:
    api: api_request_probe

    meta:
      name: 使用 basic auth 的请求探针
      tags: ["auth", "basic"]
      priority: P0

    request:
      auth:
        type: basic
        username: "${basic_username}"
        password: "${basic_password}"

  case_probe_with_api_key_header:
    api: api_request_probe

    meta:
      name: 使用 header api_key 的请求探针
      tags: ["auth", "api-key"]
      priority: P0

    request:
      auth:
        type: api_key
        in: header
        key: X-Token
        value: "${auth_token}"

  case_probe_with_api_key_query:
    api: api_request_probe

    meta:
      name: 使用 query api_key 的请求探针
      tags: ["auth", "api-key"]
      priority: P0

    request:
      auth:
        type: api_key
        in: query
        key: token
        value: "${auth_token}"

  case_probe_with_api_key_cookie:
    api: api_request_probe

    meta:
      name: 使用 cookie api_key 的请求探针
      tags: ["auth", "api-key"]
      priority: P0

    request:
      cookies:
        auth_token: stale-cookie-token
      auth:
        type: api_key
        in: cookie
        key: auth_token
        value: "${auth_token}"

  case_raw_text_payload:
    api: api_raw_payload_probe

    meta:
      name: raw text 请求体
      tags: ["raw", "text"]
      priority: P0

    request:
      body_mode: raw
      raw:
        raw_type: text
        content: hello raw text

  case_raw_xml_payload:
    api: api_raw_payload_probe

    meta:
      name: raw xml 请求体
      tags: ["raw", "xml"]
      priority: P0

    request:
      body_mode: raw
      raw:
        raw_type: xml
        content: |
          <config>
            <name>demo</name>
          </config>

  case_raw_html_payload:
    api: api_raw_payload_probe

    meta:
      name: raw html 请求体
      tags: ["raw", "html"]
      priority: P0

    request:
      body_mode: raw
      raw:
        raw_type: html
        content: "<div>demo</div>"

  case_raw_javascript_payload:
    api: api_raw_payload_probe

    meta:
      name: raw javascript 请求体
      tags: ["raw", "javascript"]
      priority: P0

    request:
      body_mode: raw
      raw:
        raw_type: javascript
        content: "console.log('demo');"

  case_binary_upload_demo:
    api: api_binary_upload

    meta:
      name: 二进制上传示例
      tags: ["binary", "file"]
      priority: P0
