scenario_id: scn_reading_house_public_smoke

meta:
  name: 读书屋公开接口冒烟场景
  module: 读书屋
  tags: ["smoke", "public"]
  priority: P0
  description: |
    使用公开榜单接口提取 bookId，再查询书籍详情，并覆盖主要公开列表接口。
    自 v0.2 起作为 CLI smoke 主战场（minimal 因无本地 backend 仅做 schema + 调度回归）；
    含 hook script 与 inline script always_run 兜底各一例，方便端到端验证 action_runner 调度。

env: test

before_steps:
  # 用 list-form command 跨平台兼容；hook script 默认 expect_returncode=0,
  # 失败会截停整个主流程, 适合做"环境前置自检"而不是"真实清理"。
  - id: 打印 smoke 启动标记
    action:
      kind: script
      command: ["python", "-c", "print('reading_house public smoke start')"]
      extract:
        - source: stdout
          as: smoke_start_marker

steps:
  - id: 获取点击榜单并提取书籍ID
    use: case_book_click_rank_success

  - id: 查询书籍详情
    use: case_book_detail_success

  - id: 查询新书榜单
    use: case_book_new_rank_success

  - id: 查询最新更新榜单
    use: case_book_update_rank_success

  - id: 查询排行榜Top30
    use: case_book_rank_top30_success

  - id: 查询全部作品列表
    use: case_book_category_success

  # CLI smoke 兜底: 即使前面任何一步 error/failed, 这条 inline script 也会执行 (always_run),
  # 自身失败也不阻塞 scenario 收尾 (continue_on_error). cleanup_marker 写回 ctx 后,
  # 后续 scenario.assertions / 平台 BI 都可以读到. 与 minimal/hanoi_hooks.yaml 的 "兜底脚本清理" 写法一致.
  - id: 兜底脚本清理
    action:
      kind: script
      command: ["python", "-c", "print('reading_house public smoke cleanup ok')"]
      extract:
        - source: stdout
          as: cleanup_marker
        - source: returncode
          as: cleanup_rc
    always_run: true
    continue_on_error: true
