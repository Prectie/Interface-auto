scenario_id: scn_hanoi_dataset_flow
env: test

meta:
  name: 汉诺塔数据集流程
  module: 汉诺塔
  tags: ["回归", "dataset"]
  priority: P1
  owner: qa

datasets:
  - name: level_3
    variables:
      level_state: "3"

  - name: level_5
    variables:
      level_state: "5"

steps:
  - id: 启动任务
    use: case_start_task_success

  - id: 上传任务数据
    use: case_update_task_member_level_4
    override:
      request:
        raw:
          raw_type: json
          content:
            attrs:
              级数设置:
                state: "${level_state}"

  - id: 停止任务
    use: case_stop_task_success
